name: APM

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup APM
        uses: equisoft-actions/setup-apm@v1
        with:
          app-id: ${{ vars.APM_APP_ID }}
          private-key: ${{ secrets.APM_APP_PRIVATE_KEY }}
      - name: APM audit
        run: apm audit --ci --no-cache
